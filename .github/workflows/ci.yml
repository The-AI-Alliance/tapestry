name: CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".common.mk"
      - ".console-colors.mk"
      - ".website.mk"
      - "Makefile"
      - "src/**"
      - "contrib/**"
      - "examples/**"
      - "**/pyproject.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Format · Lint · Type-check · Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check contrib target failures
        run: |
          if make contrib-ls; then
            echo "make contrib-ls should fail"
            exit 1
          fi

      # Every contrib/*/.targets.mk must be read by the top-level Makefile,
      # otherwise the contributions' custom targets are silently unreachable.
      - name: Check contrib custom targets are included
        run: |
          expected=$(ls contrib/*/.targets.mk 2>/dev/null | wc -l)
          actual=$(make print-contrib-targets-mks-count)
          echo "contrib .targets.mk files: $expected present, $actual included"
          test "$expected" -eq "$actual"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache uv download cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # Do not cache .venv. Restored venvs keep a python3 symlink into the
      # runner image; that path disappears on the next image, and
      # `if [ ! -d .venv ]` then skips recreation. Keep the uv download cache.
      - name: Create virtual environment
        run: uv venv --no-managed-python

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run before-pr checks
        run: make GITHUB_CI='true' before-pr
