name: CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - "**/.*.mk"
      - "**/Makefile"
      - "**/*.toml"
      - ".github/workflows/*.yml"
      - "src/**"
      - "contrib/**"
      - "examples/**"

permissions:
  contents: read

jobs:
  quality:
    name: Format · Lint · Type-check · Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every contrib/*/.targets.mk must be read by the top-level Makefile,
      # otherwise the contributions' custom targets are silently unreachable.
      - name: Check contrib custom .targets.mk are properly included by Makefile
        run: |
          expected=$(ls contrib/*/.targets.mk 2>/dev/null | wc -l)
          actual=$(make print-contrib-targets-mks-count)
          echo "contrib .targets.mk files: $expected present, $actual included"
          test "$expected" -eq "$actual"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: uv download cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # Do not cache .venv. Restored venvs keep a python3 symlink into the runner
      # image; that path disappears on the next image causing subsequent failures.
      - name: Create virtual environment
        run: uv venv --no-managed-python

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      # The "GITHUB_CI='true'" is used in the Makefile to change the behavior of
      # some before-pr targets, specifically those like "format" that will reformat
      # the code by default. We don't want that in CI. Instead, we want tasks like
      # that to fail IF an code modifications are necessary.
      - name: Run before-pr checks
        run: make GITHUB_CI='true' before-pr
